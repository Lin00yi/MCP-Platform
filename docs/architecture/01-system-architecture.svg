<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="48" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1.0" letter-spacing="0">MCP Gateway · 系统架构（2026-10）</text>
<text x="50" y="74" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">客户端只连反向代理；数据面 :8081 / 控制面 :8082 互不依赖，共享 mcp-shared 内核；认证只认用户 token</text>
<rect x="60" y="120" width="230" height="176" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#4338ca" text-anchor="start" opacity="1.0" letter-spacing="0">AI 客户端</text><text x="78" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">DSH Desktop（插件挂载）</text><text x="78" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">Codex CLI / Cursor</text><text x="78" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">Claude / 自研 Agent</text><text x="78" y="226" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">统一 Streamable HTTP</text>
<rect x="320" y="120" width="230" height="176" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2" filter="url(#shadow)"/><text x="338" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">反向代理（自备）</text><text x="338" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">/mcp/admin|log/* → :8082</text><text x="338" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">/api/* → :8082</text><text x="338" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">其余 /mcp/* → :8081</text><text x="338" y="226" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">静态资源 → 控制台 dist</text><text x="338" y="244" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">/internal/** 不对外</text>
<rect x="580" y="120" width="520" height="176" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="598" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">S1 mcp-dataplane :8081</text><text x="598" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">/mcp/e/{endpointKey}：POST JSON-RPC · GET SSE · DELETE</text><text x="598" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">认证 x-dsh-auth-token → 拓扑解析 → 聚合 → 执行 / 代理</text><text x="598" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">/mcp/discovery/**（需 token）· /internal/**（X-Internal-Token）</text><text x="598" y="226" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">写 tool_call_record / mcp_request_log；不进 /mcp/admin/**</text>
<rect x="1140" y="120" width="230" height="176" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" filter="url(#shadow)"/><text x="1158" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#6d28d9" text-anchor="start" opacity="1.0" letter-spacing="0">上游系统</text><text x="1158" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">REST API（HTTP 转发）</text><text x="1158" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">MCP Server（透传）</text><text x="1158" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">聚合上游（{name}__{tool}）</text><text x="1158" y="226" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">本地方法（反射执行）</text>
<rect x="1400" y="120" width="140" height="176" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" filter="url(#shadow)"/><text x="1418" y="150" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="start" opacity="1.0" letter-spacing="0">Redis</text><text x="1418" y="172" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">可选</text><text x="1418" y="190" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">会话 / 事件</text><text x="1418" y="208" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">探活选主</text>
<rect x="60" y="340" width="230" height="176" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="370" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#4338ca" text-anchor="start" opacity="1.0" letter-spacing="0">mcp-console</text><text x="78" y="392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">React 18 + Vite（静态 SPA）</text><text x="78" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">pnpm build → dist/</text><text x="78" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">只调 /mcp/admin/**</text><text x="78" y="446" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">与 /mcp/log/**</text>
<rect x="320" y="340" width="470" height="176" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="338" y="370" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">S2 mcp-admin :8082</text><text x="338" y="392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">资产 CRUD：tenant / server / tool / prompt / resource</text><text x="338" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">Namespace / Endpoint 拓扑写侧 + 审批（L1–L4）</text><text x="338" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">OpenAPI 批量导入 · 用户与 RBAC（默认拒绝）</text><text x="338" y="446" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">日志查询 / 健康展示；经 /internal/** 调数据面</text>
<rect x="830" y="340" width="280" height="176" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="848" y="370" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">MySQL 8（17 张表）</text><text x="848" y="392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">租户 / 资产 / 拓扑</text><text x="848" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">治理：审批 · 账号</text><text x="848" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">运行：调用日志 · 请求日志</text>
<rect x="1150" y="340" width="390" height="176" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" filter="url(#shadow)"/><text x="1168" y="370" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="start" opacity="1.0" letter-spacing="0">用户中心（外部）</text><text x="1168" y="392" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">提供 UserTokenStore 实现（同进程 Bean）</text><text x="1168" y="410" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">签发 / 吊销 dsh_ 与 PAT；网关不做 HTTP introspection</text><text x="1168" y="428" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">未接入时受保护请求返回 503（不降级匿名）</text>
<rect x="60" y="556" width="1480" height="132" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="80" y="590" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">mcp-shared · 共享内核（jar，不依赖任一平面）</text>
<text x="80" y="616" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">shared/entity · mapper · dto · enums · utils · constants · config.security（MyBatis 实体 / Mapper / DTO）</text>
<text x="80" y="640" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">exposure（META 合并 · 分页 · 检索 · 预算 · 结果分片 · 熔断）· identity（JWS/JWE 身份断言）· topology（EndpointScopeReader）</text>
<text x="80" y="664" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">cache（工具 / Prompt / Resource 列表缓存）· health（五态 · 探活选主）· redis · catalog（发现读服务）· port（变更事件 / 连通性探测接口）</text>
<line x1="290" y1="208" x2="316" y2="208" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="550" y1="190" x2="576" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="556" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="1.0" letter-spacing="0">/mcp/*</text>
<line x1="435" y1="300" x2="435" y2="336" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="444" y="322" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="1.0" letter-spacing="0">管理端</text>
<line x1="290" y1="428" x2="316" y2="428" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="790" y1="428" x2="826" y2="428" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1100" y1="190" x2="1136" y2="190" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="700" y1="336" x2="700" y2="300" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="708" y="322" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="1.0" letter-spacing="0">/internal/**</text>
<line x1="900" y1="300" x2="900" y2="336" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="908" y="322" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="1.0" letter-spacing="0">写日志</text>
<text x="1158" y="320" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="start" opacity="1.0" letter-spacing="0">多副本时数据面接 Redis</text>
<text x="50" y="730" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">关键约束：认证只认 x-dsh-auth-token（UserTokenStore 由用户中心提供）；不存在应用 JWT / access-token / 应用授权表。</text>
<text x="50" y="750" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">控制面是资产唯一写入口；数据面只读资产与拓扑、写调用日志。跨平面只走 HTTP（/internal/** + X-Internal-Token），无共享缓存直连。</text>
<text x="50" y="770" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">客户端唯一入口 /mcp/e/{endpointKey}；旧动态路由入口已删除（未注册路径返回 404）。</text>
<text x="60" y="806" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">部署形态（本仓库）</text>
<text x="50" y="834" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">MySQL 8 手工安装，执行 db/mysql/init.sql + db/mysql/migrations/*.sql；两个 jar 由 mvn package 产出，run-local.sh 启动；</text>
<text x="50" y="854" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">控制台 pnpm build 产物由反向代理托管；Redis 仅多副本时需要；仓库不提供容器编排。</text>
</svg>