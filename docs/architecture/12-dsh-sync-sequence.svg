<text x="260" y="538" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="700" fill="#92400e" text-anchor="start" opacity="1">增量判定</text>
