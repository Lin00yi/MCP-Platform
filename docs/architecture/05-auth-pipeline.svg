<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
<defs>
<filter id="shadow" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="2.6" flood-color="#0f172a" flood-opacity="0.08"/></filter>
<marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#475569"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="50" y="48" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a" text-anchor="start" opacity="1.0" letter-spacing="0">MCP Gateway · 认证与身份链路（2026-10）</text>
<text x="50" y="74" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">数据面只认用户 token（x-dsh-auth-token）；控制面独立后台 JWT；下游按需下发 JWS/JWE 身份断言</text>
<text x="60" y="112" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">一、数据面：客户端请求（/mcp/e、/mcp/discovery、/internal）</text>
<rect x="60" y="130" width="180" height="100" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#4338ca" text-anchor="start" opacity="1.0" letter-spacing="0">请求</text><text x="78" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">x-dsh-auth-token</text><text x="78" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">dsh_ / PAT</text>
<rect x="310" y="130" width="180" height="100" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="328" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">UserTokenAuthenticator</text><text x="328" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">取 token · 缺/无效 401</text><text x="328" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">store 故障 503</text>
<rect x="560" y="130" width="180" height="100" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="578" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">UserTokenVerifier</text><text x="578" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">SHA-256 缓存 30s</text><text x="578" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">不缓存原始 token</text>
<rect x="810" y="130" width="180" height="100" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" filter="url(#shadow)"/><text x="828" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#be123c" text-anchor="start" opacity="1.0" letter-spacing="0">UserTokenStore</text><text x="828" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">用户中心提供 Bean</text><text x="828" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">同进程查签发/吊销</text>
<rect x="1060" y="130" width="180" height="100" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" filter="url(#shadow)"/><text x="1078" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9" text-anchor="start" opacity="1.0" letter-spacing="0">ResolvedIdentity</text><text x="1078" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">userId / userName</text><text x="1078" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">customerId / scopes</text>
<rect x="1310" y="130" width="180" height="100" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" filter="url(#shadow)"/><text x="1328" y="160" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0369a1" text-anchor="start" opacity="1.0" letter-spacing="0">McpIdentityContext</text><text x="1328" y="182" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">请求属性 + 上下文</text><text x="1328" y="200" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">initialize 时绑定</text>
<line x1="246" y1="180" x2="304" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="496" y1="180" x2="554" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="746" y1="180" x2="804" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="996" y1="180" x2="1054" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1246" y1="180" x2="1304" y2="180" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60" y="276" width="660" height="128" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="306" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">Endpoint 拓扑解析（认证之后）</text><text x="78" y="328" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">EndpointScopeReader.resolveScope(endpointKey)：10s 缓存，返回成员 Server + Namespace 前缀；</text><text x="78" y="346" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">Endpoint 不存在 / 已停用 → HTTP 403（JSON-RPC -32001）；租户归属见 mcp_namespace / mcp_endpoint.tenant_id。</text>
<rect x="740" y="276" width="800" height="128" rx="12" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.2" filter="url(#shadow)"/><text x="758" y="306" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="14" font-weight="700" fill="#be123c" text-anchor="start" opacity="1.0" letter-spacing="0">失败语义（fail-closed，不降级为匿名）</text><text x="758" y="328" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">401：缺少 / 无效 / 过期 token；403：Endpoint 不存在或已停用；</text><text x="758" y="346" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">503：用户中心 UserTokenStore 不可用（不是 token 失效，客户端应退避重试）。</text>
<line x1="360" y1="230" x2="360" y2="272" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60" y="452" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">二、下游身份下传（调用上游 MCP / REST 时）</text>
<rect x="60" y="470" width="350" height="120" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start" opacity="1.0" letter-spacing="0">IdentityAssertionResolver</text><text x="78" y="522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">全局模式 + Server 级覆盖（identity_mode）</text><text x="78" y="540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">INHERIT 沿用全局；统一判定点</text>
<rect x="430" y="470" width="350" height="120" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2" filter="url(#shadow)"/><text x="448" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#6d28d9" text-anchor="start" opacity="1.0" letter-spacing="0">模式判定</text><text x="448" y="522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">OFF：不下发；OPTIONAL：能签就签，失败告警继续</text><text x="448" y="540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">REQUIRED：失败拒绝 -32003，不转发下游</text>
<rect x="800" y="470" width="350" height="120" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.2" filter="url(#shadow)"/><text x="818" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#0369a1" text-anchor="start" opacity="1.0" letter-spacing="0">签发 JWS / JWE</text><text x="818" y="522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">sub=userId · cust=客编 · aud / exp / jti · scope</text><text x="818" y="540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">密钥固定 MCP_IDENTITY_SIGNING_KEY</text>
<rect x="1170" y="470" width="370" height="120" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2" filter="url(#shadow)"/><text x="1188" y="500" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#047857" text-anchor="start" opacity="1.0" letter-spacing="0">下游验签</text><text x="1188" y="522" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">McpIdentityVerifier / GatewayOriginVerifier</text><text x="1188" y="540" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">校验 iss=mcp-gateway、aud、exp；探活 scope=health</text>
<line x1="410" y1="530" x2="430" y2="530" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="780" y1="530" x2="800" y2="530" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1150" y1="530" x2="1170" y2="530" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="50" y="616" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="400" fill="#64748b" text-anchor="start" opacity="1.0" letter-spacing="0">原始用户 token 透传默认关闭（MCP_IDENTITY_FORWARD_USER_TOKEN=false），仅可信下游开启；token 不落库、不落日志。</text>
<text x="60" y="668" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="start" opacity="1.0" letter-spacing="0">三、控制面：管理端（/mcp/admin/**、/mcp/log/**）</text>
<rect x="60" y="686" width="280" height="110" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="78" y="716" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">后台登录</text><text x="78" y="738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">账号 + BCrypt 口令</text><text x="78" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">登录失败限流（用户名 / IP）</text>
<rect x="360" y="686" width="290" height="110" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="378" y="716" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">AdminJwtUtil</text><text x="378" y="738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">JWT 验签 · 有效期 1~168h</text><text x="378" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">默认 168h（7 天），上限 7 天</text>
<rect x="670" y="686" width="350" height="110" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="688" y="716" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">AdminPermissionEvaluator</text><text x="688" y="738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">角色矩阵默认拒绝</text><text x="688" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">SUPER_ADMIN &gt; ADMIN &gt; DEVELOPER &gt; OPERATOR &gt; USER</text>
<rect x="1040" y="686" width="270" height="110" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="1058" y="716" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">审批（Maker-Checker）</text><text x="1058" y="738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">敏感写操作返回 428</text><text x="1058" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">审批人 ≠ 申请人且角色更高</text>
<rect x="1330" y="686" width="210" height="110" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.2" filter="url(#shadow)"/><text x="1348" y="716" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="700" fill="#b45309" text-anchor="start" opacity="1.0" letter-spacing="0">审计</text><text x="1348" y="738" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">operation_log</text><text x="1348" y="756" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#475569" text-anchor="start" opacity="1.0" letter-spacing="0">approval_request（加密快照）</text>
<line x1="340" y1="741" x2="360" y2="741" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="650" y1="741" x2="670" y2="741" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1020" y1="741" x2="1040" y2="741" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="1310" y1="741" x2="1330" y2="741" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
</svg>