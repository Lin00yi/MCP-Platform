name: CI

# 触发：所有 push 与 PR（PR 来自 fork 时同样会跑，仓库 secrets 不会被暴露）
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 后端多模块（mcp-shared / mcp-dataplane / mcp-admin）统一在 mcp-gateway 下构建
      - name: Run tests
        run: mvn -B -ntp test

  frontend:
    name: Frontend (pnpm typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-console
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 与 mcp-console 的 engines 保持一致：pnpm 9 / Node 20 / lockfileVersion 9
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.0"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: mcp-console/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
