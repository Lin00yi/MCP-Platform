# ============================================================
# 公共配置（mcp-shared）：数据面与控制面共用的连接、序列化、日志与业务默认值
#
# 由各服务的 application.yml 通过 spring.config.import 引入：
#   spring.config.import: classpath:application-common.yml
# 服务的 application.yml 优先级更高，可覆盖这里任何一项。
# ============================================================

server:
  # 优雅停机：配合容器 stop_grace_period，避免发布时硬切进行中的 tools/call 与 SSE
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      force-response: true
      enabled: true

spring:
  lifecycle:
    timeout-per-shutdown-phase: 25s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-date-keys-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mcp.transfer.shared.entity

logging:
  level:
    root: INFO
    com.mcp.transfer: INFO
    com.mcp.transfer.shared.mapper: INFO
    org.springframework.web: INFO

# 接口文档开关：默认关闭，生产必须保持关闭；本地/测试按需设 MCP_SWAGGER_ENABLED=true
springdoc:
  api-docs:
    enabled: ${MCP_SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${MCP_SWAGGER_ENABLED:false}

# 安全相关默认值（可被 profile / 环境变量覆盖）
mcp:
  security:
    allow-private-network: ${MCP_SECURITY_ALLOW_PRIVATE_NETWORK:false}
    secretkey: ${MCP_SECURITY_SECRETKEY:}
  admin:
    jwt-secret: ${MCP_ADMIN_JWT_SECRET:}
    # 后台登录有效期（小时）：默认 7 天；支持 1～168，超过 168 按 168（7 天）处理
    jwt-ttl-hours: ${MCP_ADMIN_JWT_TTL_HOURS:168}
    init-password: ${MCP_ADMIN_INIT_PASSWORD:}
  # 浏览器跨域来源白名单（逗号分隔）；* 表示不限制。生产建议收敛为控制台域名
  cors:
    allowed-origins: ${MCP_CORS_ALLOWED_ORIGINS:*}
  # 对外网关地址：discovery 返回给 DSH 等客户端的绝对 URL
  public-base-url: ${MCP_PUBLIC_BASE_URL:http://127.0.0.1:8081}
  auth:
    # 用户 token 认证（唯一认证方式）：头名固定为 x-dsh-auth-token
    user-token:
      header: x-dsh-auth-token
      cache-ttl-seconds: 30
      # 仅开发/E2E：token|userId|userName|customerId|scopes，多条用 ; 分隔
      static-tokens: ${MCP_AUTH_STATIC_TOKENS:}
  session:
    max-count: 20000
  sse:
    max-connections: 1000
    # SSE 心跳间隔（毫秒，<=0 关闭）；避免空闲连接被代理/NAT 静默断开
    ping-interval-ms: 25000
    # 单个用户允许的 SSE 连接数（<=0 不限制），防止单客户端占满连接池
    max-connections-per-user: 20
  log:
    # tool_call_record 保留天数（0 = 不清理）；避免调用明细表无限增长
    tool-call-retention-days: 30
  # 登录失败限流（进程内双维度：用户名 20 次/15min、IP 5 次/15min）
  login:
    max-failures-per-user: 20
    max-failures-per-ip: 5
  # 下游调用熔断（与健康探测互补）
  health:
    circuit:
      failure-threshold: 5
      open-seconds: 30
  identity:
    enabled: ${MCP_IDENTITY_ENABLED:false}
    # OFF / OPTIONAL / REQUIRED；Server 可用 identity_mode 覆盖
    mode: ${MCP_IDENTITY_MODE:OPTIONAL}
    token-format: ${MCP_IDENTITY_TOKEN_FORMAT:JWE}
    issuer: mcp-gateway
    signing-private-key: ${MCP_IDENTITY_SIGNING_KEY:}
    signing-kid: gw-1
    ttl-seconds: 60
    user-token-header: x-dsh-auth-token
    forward-user-token: ${MCP_IDENTITY_FORWARD_USER_TOKEN:false}
    propagate-to-rest-tools: false
    customer-arg-names: customerId,customer_id,custId
  # 工具规模治理：只保留两个应急/部署开关，其余高级参数见 docs/配置说明.md
  tools:
    # 应急回退：false 时所有 server 按 DIRECT 处理
    meta-enabled: ${MCP_TOOLS_META_ENABLED:true}
    # read_result_chunk 暂存载体：memory（默认）/ redis（多副本共享）
    chunk-store: ${MCP_TOOLS_CHUNK_STORE:memory}

  # Prompt / Resource / Tool 结果内容上限
  assets:
    prompt-max-bytes: 262144
    resource-max-bytes: 1048576
    tool-result-max-bytes: 1048576
